# On every push: the C core (build with warnings as errors, unit tests, line and branch coverage) and the Python
# bench (lint, format, types, tests in random order with coverage, spelling, local links).
# Read-only: nothing here writes to the repository.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the core and run its unit tests
        shell: bash
        run: make -C core test | tee core-tests.log
      - name: Coverage of the core
        shell: bash
        run: make -s -C core coverage | tee core-coverage.log
      - name: Summary on the run page
        if: always()
        shell: bash
        run: |
          {
            echo "### C core"
            echo
            tail -n 1 core-tests.log
            echo
            echo "| File | Lines | Branches taken |"
            echo "|---|---|---|"
            awk "/^File/{f=\$2} /Lines executed/{split(\$0,a,\":\"); l=a[2]} /Taken at least once/{split(\$0,b,\":\"); print \"| \" f \" | \" l \" | \" b[2] \" |\"}" core-coverage.log
          } >> "$GITHUB_STEP_SUMMARY"
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: make -s -C core build/libtitra_core.so
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests in random order, with line and branch coverage of the bench
        shell: bash
        run: python -m pytest -q --cov --randomly-seed="$GITHUB_RUN_ID" | tee pytest.log
      - name: Summary on the run page
        if: always()
        shell: bash
        run: |
          count() { python -m pytest --collect-only -q -p no:randomly -m "$1" 2>/dev/null | tail -n 1 | grep -Eo '^[0-9]+' || echo 0; }
          {
            echo "### Bench tests"
            echo
            grep -E "passed|failed" pytest.log | tail -n 1
            echo "Random order: replay it with \`python -m pytest --randomly-seed=$GITHUB_RUN_ID\`."
            echo
            echo "| Kind | Tests |"
            echo "|---|---|"
            echo "| Unit | $(count 'not integration and not e2e and not live') |"
            echo "| Integration | $(count integration) |"
            echo
            echo "### Coverage of the bench (lines and branches)"
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - run: codespell
      - run: python scripts/check_links.py
      - run: python scripts/check_placeholders.py
