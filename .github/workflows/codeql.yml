# Static analysis of the C core, the Python bench and these workflows. Its runs and badge are public; its alerts are
# visible only to people with write access.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  analyze:
    # Code scanning needs a public repository (or GitHub Code Security), so this waits until the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'c-cpp' && 'manual' || 'none' }}
      - if: matrix.language == 'c-cpp'
        run: make -C core build/libtitra_core.so build/test_core
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
