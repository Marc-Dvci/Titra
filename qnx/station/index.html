<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titra nurse station</title>
<style>
  :root {
    --ink: #202124; --muted: #5f6368; --rule: #e0e3e7; --ground: #ffffff;
    --blue: #1a73e8; --green: #188038; --band: #e6f4ea; --amber: #b06000; --amber-bg: #fef7e0;
    --red: #c5221f; --red-bg: #fce8e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink);
         font: 15px/1.45 Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 20px 32px 12px; border-bottom: 1px solid var(--rule); }
  header h1 { font-size: 22px; font-weight: 500; margin: 0; letter-spacing: 0.2px; }
  header .sub { color: var(--muted); }
  header .clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
  main { padding: 0 32px 24px; }
  .cot { display: grid; grid-template-columns: 120px 150px 130px 1fr 170px; gap: 24px; align-items: center;
         padding: 20px 0; border-bottom: 1px solid var(--rule); }
  .name { font-size: 18px; font-weight: 500; }
  .name small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  .label { color: var(--muted); font-size: 13px; letter-spacing: 0.2px; }
  .big { font-size: 44px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .big.in { color: var(--green); } .big.out { color: var(--ink); } .big.none { color: var(--muted); }
  .fio2 { font-size: 26px; font-variant-numeric: tabular-nums; color: var(--blue); }
  .state { font-size: 14px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 13px; font-weight: 500; }
  .chip.control { background: #e8f0fe; color: var(--blue); }
  .chip.hold { background: var(--amber-bg); color: var(--amber); }
  .chip.fallback, .chip.offline { background: var(--red-bg); color: var(--red); }
  .alarm { margin-top: 6px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .alarm.medium { color: var(--amber); } .alarm.high { color: var(--red); font-weight: 500; }
  svg { width: 100%; height: 84px; display: block; }
  .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .legend { display: flex; gap: 18px; padding: 10px 32px 0; color: var(--muted); font-size: 13px; }
  .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }
  .tir { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .advice { grid-column: 1 / -1; display: grid; grid-template-columns: 120px 1fr; gap: 24px; margin-top: -8px; font-size: 14px; }
  .advice .order { color: var(--muted); font-size: 13px; }
  .advice .action { font-weight: 500; }
  .advice .why { color: var(--muted); }
  .advice .flagged .action { color: var(--amber); }
  .panel { padding: 16px 32px 4px; border-top: 1px solid var(--rule); }
  .panel h2 { font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  .panel p { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
  .panel p b { color: var(--ink); font-weight: 500; }
  button { font: inherit; font-size: 13px; color: var(--blue); background: none; border: 1px solid var(--rule); border-radius: 4px;
           padding: 3px 10px; cursor: pointer; }
  .model { font-size: 13px; color: var(--muted); padding: 10px 32px 16px; }
  .nurse { color: var(--ink); }
  form.note { display: flex; gap: 10px; align-items: center; margin: 4px 0 8px; font-size: 14px; }
  form.note input[type=text] { flex: 1; max-width: 560px; font: inherit; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 4px; }
  form.note select { font: inherit; padding: 2px 4px; border: 1px solid var(--rule); border-radius: 4px; background: var(--ground); }
  footer { padding: 14px 32px; color: var(--muted); font-size: 13px; }
  @media (max-width: 900px) { .cot { grid-template-columns: 1fr 1fr; } svg { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header>
  <h1>Titra</h1><span class="sub">Nurse station</span>
  <span class="clock" id="clock"></span>
</header>
<div class="legend"><span><i style="background:#202124"></i>SpO2, 10 s mean</span><span><i style="background:#1a73e8"></i>FiO2</span><span><i style="background:#e6f4ea;height:10px"></i>Target 91-95%</span></div>
<main id="cots" aria-live="polite"></main>
<div class="model" id="model"></div>
<section class="panel" aria-label="Nurse's note"><h2>Nurse's note</h2>
  <form class="note" id="note-form">
    <label for="note-cot">Cot</label><select id="note-cot"><option>1</option><option>2</option><option>3</option></select>
    <input type="text" id="note-text" maxlength="120" placeholder="Read by the advisor as information, never as an instruction" aria-label="Note">
    <button type="submit">Save</button>
  </form></section>
<section class="panel" aria-label="Shift handover"><h2>Shift handover <button id="handover">Write it now</button></h2><div id="handover-text"></div></section>
<section class="panel" aria-label="System notes"><h2>System notes</h2><div id="incidents"></div></section>
<footer id="foot">QNX 8.0</footer>
<script>
const ALARMS = {1: "SpO2 signal lost, FiO2 held", 2: "Fallback FiO2 applied", 4: "Oximeter data repeated or frozen",
  8: "SpO2 below 85%", 16: "SpO2 below 80%", 32: "SpO2 above 98% on oxygen", 64: "FiO2 at its upper limit"};
const MODES = {control: "Control", hold: "Hold", fallback: "Fallback"};
let history = {};
let advice = {};
const ORDER = ["First", "Second", "Third", "Fourth"];

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

function adviceRow(cot) {
  const notes = advice.watch && advice.watch.notes ? advice.watch.notes : [];
  const i = notes.findIndex(n => n.cot === cot);
  if (i < 0) return "";  // no advice before the first watch
  const n = notes[i], flagged = n.action !== "no action needed";
  return `<div class="advice ${flagged ? "flagged" : ""}"><div class="order">${ORDER[i] || ""}</div>
    <div><span class="action">${esc(n.action[0].toUpperCase() + n.action.slice(1))}.</span> <span class="why">${esc(n.why)}${riskText(cot)}</span></div></div>`;
}

function riskText(cot) {
  const f = (advice.flags || []).find(x => x.cot === cot);
  const risk = f && f.risk >= 0 ? ` Chance of a dip in 10 minutes: ${f.risk}%.` : "";
  const note = f && f.note ? ` <span class="nurse">Nurse's note: ${esc(f.note)}</span>` : "";
  return risk + note;
}

function modelLine() {
  if (!advice.watch) return "Advisor starting.";
  if (advice.watch.age_s < 0) return "Advice starts after five minutes of history. Advice only: this software has no path to any blender.";
  const w = advice.watch, source = w.source === "model"
    ? `Written by the on-board model and checked against the facts: ${w.loops} loop${w.loops === 1 ? "" : "s"}, ${w.tokens} tokens, ${(w.total_ms / 1000).toFixed(0)} s`
    : w.validator === "nothing flagged" ? "Nothing flagged: the rules' own sentences"
    : "Deterministic flags" + (advice.model === "unavailable" ? ": the model is unavailable" : "");
  const age = w.age_s >= 0 ? ` · ${Math.round(w.age_s / 60)} min ago` : "";
  return `${source}${age}. Advice only: this software has no path to any blender.`;
}

function renderAdvice() {
  document.getElementById("model").textContent = modelLine();
  const h = advice.handover;
  const state = h ? h.state : "none";
  document.getElementById("handover").disabled = state === "running";
  document.getElementById("handover").textContent = state === "running" ? "Writing" : "Write it now";
  document.getElementById("handover-text").innerHTML = h && h.notes && h.notes.length && state === "done"
    ? h.notes.map(n => `<p><b>Cot ${n.cot}.</b> ${esc(n.why)}</p>`).join("") : "";
  const inc = advice.incidents || [];
  document.getElementById("incidents").innerHTML = inc.length
    ? inc.slice(0, 4).map(e => `<p><b>Cot ${e.cot}, ${Math.round(e.age_s / 60)} min ago.</b> ${esc(e.note)}</p>`).join("")
    : "<p>Nothing to report.</p>";
}

function inTarget(spo2, fio2) { return fio2 <= 0.211 ? spo2 >= 91 : spo2 >= 91 && spo2 <= 95; }

function alarmText(c) {
  const list = Object.entries(ALARMS).filter(([bit]) => c.alarms & bit).map(([, t]) => t);
  if (c.valve_link === 0) list.push("Blender driver not answering");
  else if (c.blender_link === 0) list.push("Blender not answering its driver");
  return list.join(" · ");
}

function trend(points) {
  const W = 600, H = 84, span = 900, bin = 10;
  if (!points || !points.length) return `<svg viewBox="0 0 ${W} ${H}"></svg>`;
  const t1 = points[points.length - 1][0], t0 = t1 - span;
  const x = t => ((t - t0) / span) * W;
  const ys = v => H - 4 - ((Math.max(70, Math.min(100, v)) - 70) / 30) * (H - 8);
  const yf = v => H - 4 - (Math.min(1, v) - 0.21) / 0.79 * (H - 8);
  // 10-second means of valid SpO2 readings, so the trend shows the baby rather than the noise of one reading.
  const bins = new Map();
  for (const [t, spo2] of points) {
    if (t < t0 || spo2 < 0) continue;
    const k = Math.floor(t / bin);
    const b = bins.get(k) || [0, 0]; b[0] += spo2; b[1] += 1; bins.set(k, b);
  }
  let s = "", f = "", prev = null;
  for (const [k, [sum, n]] of [...bins.entries()].sort((a, b) => a[0] - b[0])) {
    const tx = x((k + 0.5) * bin);
    s += `${prev !== null && k === prev + 1 ? "L" : "M"}${tx.toFixed(1)},${ys(sum / n).toFixed(1)}`;
    prev = k;
  }
  for (const [t, , fio2] of points) {
    if (t < t0 || fio2 < 0) continue;
    f += `${f ? "L" : "M"}${x(t).toFixed(1)},${yf(fio2).toFixed(1)}`;
  }
  const band = `<rect x="0" y="${ys(95)}" width="${W}" height="${ys(91) - ys(95)}" fill="#e6f4ea"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="SpO2 and FiO2, last 15 minutes">${band}
    <path d="${f}" fill="none" stroke="#1a73e8" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <path d="${s}" fill="none" stroke="#202124" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="axis"><span>15 min ago</span><span>now</span></div>`;
}

function timeInTarget(points) {
  let n = 0, k = 0;
  for (const [, spo2, fio2] of points || []) if (spo2 >= 0) { n++; if (inTarget(spo2, fio2)) k++; }
  return n ? Math.round(100 * k / n) + "% in target, last hour" : "";
}

function row(c) {
  if (c.offline) {
    return `<section class="cot"><div class="name">Cot ${c.cot}</div><div class="big none">--</div><div></div>
      <div><span class="chip offline">Controller restarting</span></div><div></div></section>`;
  }
  const valid = c.sample === 0 && c.spo2 >= 0;
  const cls = !valid ? "none" : inTarget(c.spo2, c.fio2) ? "in" : "out";
  const level = c.alarm >= 3 ? "high" : c.alarm === 2 ? "medium" : "";
  const pts = (history[c.cot] || []);
  return `<section class="cot" aria-label="Cot ${c.cot}">
    <div class="name">Cot ${c.cot}<small>backup FiO2 ${c.backup.toFixed(2)}</small></div>
    <div><div class="label">SpO2</div><div class="big ${cls}">${valid ? c.spo2 + "<small>%</small>" : "--"}</div></div>
    <div><div class="label">FiO2</div><div class="fio2">${c.fio2.toFixed(2)}</div></div>
    <div>${trend(pts)}<div class="tir">${timeInTarget(pts)}</div></div>
    <div class="state"><span class="chip ${c.mode}">${MODES[c.mode] || c.mode}</span>
      <div class="alarm ${level}">${alarmText(c)}</div></div>
    ${adviceRow(c.cot)}
  </section>`;
}

async function refresh() {
  try {
    const r = await fetch("/api/cots", {cache: "no-store"});
    const d = await r.json();
    document.getElementById("cots").innerHTML = d.cots.map(row).join("");
    const up = Math.floor(d.uptime);
    document.getElementById("foot").textContent =
      `QNX 8.0 · station up ${Math.floor(up / 3600)} h ${Math.floor(up / 60) % 60} min`;
  } catch (e) {
    document.getElementById("foot").textContent = "Board not answering";
  }
  document.getElementById("clock").textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
}

async function refreshHistory() {
  try {
    const d = await (await fetch("/api/history", {cache: "no-store"})).json();
    for (const c of d.cots) history[c.cot] = c.points;
  } catch (e) { /* the next poll retries */ }
}

async function refreshAdvice() {
  try {
    advice = await (await fetch("/api/advice", {cache: "no-store"})).json();
    renderAdvice();
  } catch (e) { /* the next poll retries */ }
}

document.getElementById("handover").addEventListener("click", () => {
  fetch("/api/handover", {method: "POST"}).then(refreshAdvice);
});

document.getElementById("note-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const cot = document.getElementById("note-cot").value, input = document.getElementById("note-text");
  fetch(`/api/note?cot=${cot}&text=${encodeURIComponent(input.value)}`, {method: "POST"}).then(() => {
    input.value = "";
    refreshAdvice();
  });
});

refreshHistory(); refresh(); refreshAdvice();
setInterval(refresh, 1000);
setInterval(refreshHistory, 5000);
setInterval(refreshAdvice, 2000);
</script>
</body>
</html>
